version: '3.8'

# ==============================================================================
# ZYCONOMES INSTITUTIONAL BANKING - TOPOLOGIA DE PRODUÇÃO / STAGING
# ==============================================================================
# Contém:
# 1. PostgreSQL 16 (Armazenamento com limite de 100 conexões reais)
# 2. PgBouncer (Multiplexador de conexões na porta 6432 - pool_mode: transaction)
# 3. Redis 7 (Idempotência atômica SETNX e cache em memória)
# 4. RabbitMQ 3 com Management UI & Dead Letter Queue (DLQ)
# 5. Core API (Node.js Express com Correlation-ID)
# 6. Email Worker (Consumidor assíncrono com retry e fallback DLQ)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. POSTGRESQL (Banco de Dados Principal)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: zyconomes_postgres
    restart: always
    environment:
      POSTGRES_USER: zyco_admin
      POSTGRES_PASSWORD: zyco_secret_vault_2026
      POSTGRES_DB: zyconomes_prod
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    command: >
      postgres -c max_connections=120
               -c shared_buffers=512MB
               -c effective_cache_size=1536MB
               -c work_mem=16MB
               -c maintenance_work_mem=128MB
               -c synchronous_commit=off
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d
    networks:
      - zyconomes_network
    ports:
      # Apenas para administração / migrations (não usado pela aplicação diretamente)
      - "5432:5432"

  # ----------------------------------------------------------------------------
  # 2. PGBOUNCER (Pool Multiplexado de Transações)
  # ----------------------------------------------------------------------------
  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: zyconomes_pgbouncer
    restart: always
    environment:
      DB_USER: zyco_admin
      DB_PASSWORD: zyco_secret_vault_2026
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: zyconomes_prod
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 5000
      DEFAULT_POOL_SIZE: 90
      MIN_POOL_SIZE: 10
      RESERVE_POOL_SIZE: 10
      MAX_DB_CONNECTIONS: 100
      SERVER_IDLE_TIMEOUT: 60
      SERVER_LIFETIME: 3600
    depends_on:
      - postgres
    networks:
      - zyconomes_network
    ports:
      - "6432:6432"

  # ----------------------------------------------------------------------------
  # 3. REDIS (Idempotência Atômica & Bloqueio Rápido de Concorrência)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: zyconomes_redis
    restart: always
    command: >
      redis-server --requirepass zyco_redis_auth_2026
                   --maxmemory 512mb
                   --maxmemory-policy allkeys-lru
                   --appendonly yes
    volumes:
      - redisdata:/data
    networks:
      - zyconomes_network
    ports:
      - "6379:6379"

  # ----------------------------------------------------------------------------
  # 4. RABBITMQ (Mensageria com Management & Dead Letter Exchange)
  # ----------------------------------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: zyconomes_rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: zyco_rabbit
      RABBITMQ_DEFAULT_PASS: zyco_rabbit_pass
    volumes:
      - rabbitdata:/var/lib/rabbitmq
    networks:
      - zyconomes_network
    ports:
      - "5672:5672"     # Porta AMQP da aplicação
      - "15672:15672"   # Painel Web de Monitoramento

  # ----------------------------------------------------------------------------
  # 5. CORE API SERVICE (Backend Node.js Express)
  # ----------------------------------------------------------------------------
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zyconomes_api
    restart: always
    command: node server.js
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://zyco_admin:zyco_secret_vault_2026@pgbouncer:6432/zyconomes_prod
      REDIS_URL: redis://:zyco_redis_auth_2026@redis:6379/0
      RABBITMQ_URL: amqp://zyco_rabbit:zyco_rabbit_pass@rabbitmq:5672
    depends_on:
      - pgbouncer
      - redis
      - rabbitmq
    networks:
      - zyconomes_network
    ports:
      - "3000:3000"

  # ----------------------------------------------------------------------------
  # 6. ASYNC EMAIL WORKER (Consumidor com DLQ e Retry)
  # ----------------------------------------------------------------------------
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zyconomes_worker
    restart: always
    command: node worker.js
    environment:
      NODE_ENV: production
      RABBITMQ_URL: amqp://zyco_rabbit:zyco_rabbit_pass@rabbitmq:5672
      REDIS_URL: redis://:zyco_redis_auth_2026@redis:6379/0
    depends_on:
      - rabbitmq
      - redis
    networks:
      - zyconomes_network

networks:
  zyconomes_network:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  rabbitdata:
